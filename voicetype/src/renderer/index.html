<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy is injected by the main process via
      `session.defaultSession.webRequest.onHeadersReceived` so we can use
      one strict policy in packaged builds and a Vite-HMR-friendly one in
      dev. Keeping it out of the meta tag avoids the historical pitfall
      where the dev policy ("ws: wss:") shipped to production unchanged.
      See `setupContentSecurityPolicy` in `src/main/index.ts`.
    -->
    <title>Echo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&family=Geist:wght@400;450;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Sticky-note windows: mark <html> and inject a blocking style before
      // <body> is parsed so the splash never renders a single frame.
      (function () {
        try {
          if (new URLSearchParams(window.location.search).has('stickyNote')) {
            document.documentElement.classList.add('is-sticky-note');
            document.title = 'Note';
            var s = document.createElement('style');
            s.textContent =
              '#splash{display:none!important;visibility:hidden!important}' +
              'html,html body,html #root{background:transparent!important}';
            document.head.appendChild(s);
          }
        } catch (_) { /* no-op */ }
      })();
    </script>
    <style>
      html.is-sticky-note #splash { display: none !important; visibility: hidden !important; }
      html.is-sticky-note,
      html.is-sticky-note body,
      html.is-sticky-note #root { background: transparent !important; }
    </style>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        font-family: "Figtree", "Aptos", "Segoe UI Variable Display", "Segoe UI Variable Text", "SF Pro Display", "Helvetica Neue", sans-serif;
        background: #EFECE3;
      }

      #root {
        height: 100%;
        background: #EFECE3;
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0) 42%),
          #EFECE3;
        transition: opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1),
                    visibility 0.26s cubic-bezier(0.22, 1, 0.36, 1);
        opacity: 1;
        -webkit-font-smoothing: antialiased;
        -webkit-app-region: drag;
      }
      #splash.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      /* Vertically centered column. No card chrome — the splash bleeds
         into the canvas so the React app fades into the same surface. */
      #splash .splash-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 320px;
        padding: 0 32px;
        animation: splash-stage-in 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      #splash .splash-wordmark {
        position: relative;
        font-family: "Source Serif 4", "Iowan Old Style", Georgia, serif;
        font-weight: 500;
        font-size: 42px;
        line-height: 1;
        letter-spacing: 0;
        color: #1F1E1B;
        animation:
          splash-text-in 0.42s cubic-bezier(0.22, 1, 0.36, 1) both,
          splash-wordmark-breathe 1.4s 0.42s ease-in-out infinite;
      }

      #splash .splash-tagline {
        position: relative;
        margin-top: 12px;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.4;
        letter-spacing: 0;
        color: #6B6358;
        animation: splash-text-in 0.42s 0.04s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      #splash .splash-meter {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        height: 22px;
        margin-top: 22px;
        animation: splash-text-in 0.42s 0.08s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      #splash .splash-meter span {
        display: block;
        width: 4px;
        height: 22px;
        border-radius: 999px;
        background: #C96442;
        opacity: 0.36;
        transform-origin: center;
        transform: scaleY(0.42);
        animation: splash-meter 0.76s cubic-bezier(0.45, 0, 0.22, 1) infinite;
      }

      #splash .splash-meter span:nth-child(2) { animation-delay: 0.05s; }
      #splash .splash-meter span:nth-child(3) { animation-delay: 0.1s; }
      #splash .splash-meter span:nth-child(4) { animation-delay: 0.15s; }
      #splash .splash-meter span:nth-child(5) { animation-delay: 0.2s; }

      /* Slim progress bar centered under the loading copy. */
      #splash .splash-progress {
        position: relative;
        margin-top: 16px;
        width: 236px;
        height: 4px;
        border-radius: 999px;
        background: rgba(31, 27, 22, 0.08);
        overflow: hidden;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.48) inset;
        animation: splash-text-in 0.42s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      #splash .splash-progress-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 8%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          #B5563A 0%,
          #C96442 58%,
          #D97757 100%
        );
        box-shadow: 0 0 16px rgba(201, 100, 66, 0.26);
        animation: splash-progress 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      #splash .splash-progress-fill::after {
        content: "";
        position: absolute;
        top: 0;
        right: -40px;
        width: 40px;
        height: 100%;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.55) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: splash-shine 0.78s linear infinite;
      }

      #splash.is-complete .splash-progress-fill {
        animation: none;
        width: 100%;
        transition: width 0.16s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #splash.is-complete .splash-progress-fill::after {
        animation: none;
        opacity: 0;
      }

      @keyframes splash-progress {
        0%   { width: 8%;  }
        26%  { width: 48%; }
        68%  { width: 78%; }
        100% { width: 92%; }
      }
      @keyframes splash-shine {
        0%   { transform: translateX(-236px); }
        100% { transform: translateX(236px);  }
      }
      @keyframes splash-meter {
        0%, 100% { opacity: 0.3; transform: scaleY(0.42); }
        50%      { opacity: 0.86; transform: scaleY(1); }
      }
      @keyframes splash-text-in {
        from { opacity: 0; transform: translateY(5px); }
        to   { opacity: 1; transform: translateY(0);   }
      }
      @keyframes splash-stage-in {
        from { opacity: 0; transform: translateY(5px) scale(0.985); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes splash-wordmark-breathe {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.86; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-stage,
        #splash .splash-wordmark,
        #splash .splash-tagline,
        #splash .splash-meter,
        #splash .splash-meter span,
        #splash .splash-progress,
        #splash .splash-progress-fill,
        #splash .splash-progress-fill::after {
          animation: none !important;
        }
        #splash .splash-meter span { opacity: 0.58; transform: scaleY(0.65); }
        #splash .splash-progress-fill { width: 82%; }
        #splash.is-complete .splash-progress-fill { width: 100%; }
      }
    </style>
  </head>
  <body spellcheck="false">
    <script>
      // Sticky-note fallback: nuke splash node before browser paints it.
      (function () {
        try {
          if (new URLSearchParams(window.location.search).has('stickyNote')) {
            var s = document.getElementById('splash');
            if (s && s.parentNode) s.parentNode.removeChild(s);
            document.documentElement.classList.add('is-sticky-note');
          }
        } catch (_) {}
      })();
    </script>
    <!-- Splash screen — starts hidden; main-window code makes it visible.
         Sticky-note windows never show it (head script + main.tsx keep it hidden). -->
    <div id="splash" style="display:none" role="status" aria-label="Loading Echo">
      <div class="splash-stage">
        <div class="splash-wordmark">Echo</div>
        <div class="splash-tagline">Preparing Echo</div>
        <div class="splash-meter" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="splash-progress" aria-hidden="true">
          <div class="splash-progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
