<!DOCTYPE html>
<html class="is-sticky-note">
  <head>
    <meta charset="UTF-8" />
    <title>Note</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;

        font-family: "Figtree", "Segoe UI", sans-serif;
      }
    </style>
  </head>

    <script type="module" src="/main.tsx"></script>
  </body>
</html>
